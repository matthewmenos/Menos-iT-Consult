# Menos iT Consult — single-host Nginx site configuration
# ------------------------------------------------------------------
# One host serves everything:
#   * public site -> http(s)://menos-it.com/            (/, /about, /blog, ...)
#   * admin panel -> http(s)://menos-it.com/admin
#   * API         -> http(s)://menos-it.com/api/*
#
# Nginx only terminates TLS and proxies every request to the Express app
# listening on 127.0.0.1:3000 (backend/server.js). That single process
# serves the public files, the admin SPA and the API, so all three share
# one origin — exactly what "hosted on one host" means here.
#
# Install:
#   sudo cp backend/nginx.conf /etc/nginx/sites-available/menos-it
#   sudo ln -s /etc/nginx/sites-available/menos-it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (certbot):
#   sudo apt-get install certbot python3-certbot-nginx
#   sudo certbot --nginx -d menos-it.com -d www.menos-it.com
# ------------------------------------------------------------------
# Note: nginx >= 1.25.1 deprecates `listen ... http2`; replace the two
#       `listen 443 ssl http2;` lines with `listen 443 ssl;` + `http2 on;`
# ------------------------------------------------------------------

upstream menos_it_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name menos-it.com www.menos-it.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name menos-it.com www.menos-it.com;

    # --- TLS (Certbot-managed; replace domain/paths as needed) ---
    ssl_certificate     /etc/letsencrypt/live/menos-it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menos-it.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;

    # --- Proxy defaults (inherited by every location below) ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    # Backend API  -> /api/*
    location /api/ {
        proxy_pass http://menos_it_app;
    }

    # Admin dashboard (Express serves index.html + assets + SPA fallback)
    location /admin {
        proxy_pass http://menos_it_app;
    }

    # Everything else — public pages, homepage, 404 fallback (all from Express)
    location / {
        proxy_pass http://menos_it_app;
    }
}