<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Menos iT Consult</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Standalone login page tweaks (reuses style.css classes otherwise) */
    .login-mark {
      width: 54px; height: 54px; margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1a56db, #1648c0);
      color: #fff; font-size: 26px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(26,86,219,.35);
    }
    .login-alt { text-align: center; margin-top: 20px; font-size: 13px; }
    .login-alt a { color: var(--text-muted); transition: color var(--transition); }
    .login-alt a:hover { color: var(--blue); }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">

      <div class="login-logo">
        <div class="login-mark" aria-hidden="true">M</div>
        <h1>Menos iT Consult</h1>
        <p>Admin Dashboard — Sign in</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin"
                 autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
        <p id="login-error" class="error-msg" style="display:none" role="alert"></p>
      </form>

      <p class="login-alt"><a href="/">← Back to website</a></p>
    </div>
  </div>

  <script>
    (() => {
      var form   = document.getElementById('login-form');
      var errEl  = document.getElementById('login-error');
      var btn    = document.getElementById('login-btn');
      var userEl = document.getElementById('username');
      var passEl = document.getElementById('password');

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
      }

      // Already signed in? Go straight to the dashboard.
      fetch('/api/auth/me', { credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d.loggedIn) location.replace('index.html'); })
        .catch(function () { /* server unreachable — let the user try anyway */ });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: userEl.value.trim(),
            password: passEl.value,
          }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.success) {
              location.href = 'index.html'; // dashboard SPA
            } else {
              showError(data.error || 'Invalid username or password.');
            }
          })
          .catch(function () {
            showError('Network error. Is the server running?');
          })
          .finally(function () {
            btn.disabled = false;
            btn.textContent = 'Sign In';
          });
      });
    })();
  </script>
</body>
</html>
